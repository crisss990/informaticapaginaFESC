<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>UNAM</title>
    <script type="text/javascript" src="java.js" defer></script>
</head>
<body>
    <center>

            <h1 style="flex:2;">Universidad Nacional Autónoma de México</h1>
            <img src="https://upload.wikimedia.org/wikipedia/commons/2/2f/Escudo_UNAM_transparent.png" width="80" height="80" style="margin:10px;">
        </header>
    </center>

    <nav style="background-color:aqua; height:60px;">
        <ul style="display:flex; list-style:none; margin-left:400px; margin-top:0px; padding-top:0px;">
            <a href="http://www.google.com" target="_blank" style="text-decoration:none;">
                <li style="margin-left:20px; background-color:green; width:100px; text-align:center; margin-top:20px; color:white; line-height:30px;">Google</li>

            <a href="http://www.google.com" target="_blank" style="text-decoration:none;">

            <center><img src="https://upload.wikimedia.org/wikipedia/commons/2/2f/Escudo_UNAM_transparent.png" width="120" height="100"></center>
        </section>

        <aside id="seccionAside" style="flex:2; background-color:silver; height:300px;">
            <h1 style="text-align:center;">Datos del alumno</h1>
        </aside>
    </div>

    <footer style="background-color:maroon; height:100px; color:white; display:flex; align-items:center; justify-content:center;">
        <h1 style="margin-top:0px; font-size: 24px;">Licenciatura en informática</h1>
